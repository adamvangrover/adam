[package]
name = "rust_ext"
version = "30.1.0"
edition = "2021"

[lib]
name = "rust_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23.0", features = ["abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.10"
thiserror = "2.0"

[features]
default = []
extension-module = ["pyo3/extension-module"]
