[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afos"
version = "30.1.0"
description = "Autonomous Financial Operating System - Credit Risk & Underwriting Engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "AFOS Core Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "torch>=2.6.0,<2.7.0",
    "transformers>=4.48.2,<5.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "structlog>=24.4.0,<25.0.0",
    "scipy>=1.14.0,<2.0.0",
]

[project.optional-dependencies]
risk-agent = [
    "scikit-learn>=1.6.0,<2.0.0",
    "networkx>=3.4.0,<4.0.0",
    "lightgbm>=4.5.0,<5.0.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["afos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=afos --cov-fail-under=85"
asyncio_mode = "auto"
