apiVersion: apps/v1
kind: Deployment
metadata:
  name: adam-sidecar-agents
  labels:
    app: adam-sidecar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adam-sidecar
  template:
    metadata:
      labels:
        app: adam-sidecar
    spec:
      containers:
      - name: sentinel-nexus-agent
        image: adam-swarm:latest
        command: ["python", "-m", "src.mcp_server"]
        ports:
        - containerPort: 5001
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONPATH
          value: "/app"
        - name: ADAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: adam-secrets
              key: ADAM_API_KEY
        - name: STS_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: adam-secrets
              key: STS_AUTH_SECRET
        livenessProbe:
          tcpSocket:
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
        - name: public-keys-volume
          mountPath: /etc/pki/afos
          readOnly: true
        - name: sidecar-data-volume
          mountPath: /var/data/sidecar
      volumes:
      - name: config-volume
        configMap:
          name: adam-sidecar-config
      - name: public-keys-volume
        configMap:
          name: adam-public-keys
          optional: true
      - name: sidecar-data-volume
        persistentVolumeClaim:
          claimName: adam-sidecar-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: adam-sidecar-svc
spec:
  selector:
    app: adam-sidecar
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adam-sidecar-config
data:
  sidecar.yaml: |
    agent_mode: swarm
    log_level: info
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adam-sidecar-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
