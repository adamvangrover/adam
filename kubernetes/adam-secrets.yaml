# AFOS Zero-Trust Secret Management Matrix
# In production, this manifest is hydrated by ExternalSecrets / Vault / AWS Secrets Manager.
# Zero-trust principle: Verifiers only require Public Keys; static shared secrets are eliminated.
apiVersion: v1
kind: Secret
metadata:
  name: adam-secrets
  labels:
    app: adam-os
    security.afos/zero-trust: "enforced"
type: Opaque
stringData:
  ADAM_API_KEY: "PLACEHOLDER_SET_BY_SECRETS_MANAGER"
  DATABASE_URL: "postgresql://adam_admin:PLACEHOLDER@adam-db:5432/adam_db"
  STS_AUTH_SECRET: "PLACEHOLDER_SET_BY_SECRETS_MANAGER"
  NEO4J_AUTH: "neo4j/PLACEHOLDER"
---
# Public Key Verification ConfigMap for Zero-Trust Sidecars & Open-Source Work
apiVersion: v1
kind: ConfigMap
metadata:
  name: adam-public-keys
  labels:
    app: adam-os
    security.afos/verification: "public-key"
data:
  # In zero-trust mode, agents and sidecars verify token signatures using public keys only
  jwt_public_key.jwk: |
    {
      "kty": "oct",
      "alg": "HS256",
      "use": "sig",
      "kid": "afos-open-source-dev-v1"
    }
  sts_verifier_policy.yaml: |
    verification:
      mode: asymmetric_zero_trust
      allow_open_source_fallback: true
      max_ttl_seconds: 900
