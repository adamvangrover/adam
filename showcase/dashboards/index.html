<script>
const data=JSON.parse(document.getElementById('manifest').textContent);
const list=document.getElementById('list'),q=document.getElementById('q'),bar=document.querySelector('.bar'),fam=document.getElementById('fam');
const sel={kind:'all',family:'all'};
function buttons(el,key){
  ['all',...new Set(data.dashboards.map(d=>d[key]))].sort().forEach(k=>{
    const b=document.createElement('button');b.textContent=k;b.setAttribute('aria-pressed',k==='all');
    b.onclick=()=>{sel[key]=k;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();};
    el.appendChild(b);
  });
}
buttons(bar,'kind');buttons(fam,'family');
function render(){
  const term=q.value.toLowerCase();
  const rows=data.dashboards.filter(d=>(sel.kind==='all'||d.kind===sel.kind)&&(sel.family==='all'||d.family===sel.family)&&(d.title+' '+d.path).toLowerCase().includes(term))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||a.path.localeCompare(b.path));
  list.replaceChildren(...rows.map(d=>{
    const li=document.createElement('li'),a=document.createElement('a'),t=document.createElement('div'),m=document.createElement('div');
    if(/^[\w.-]+\.html$/.test(d.path))a.href=d.path;t.className='t';t.textContent=d.title;m.className='m';m.textContent=[d.kind,d.family,d.date,d.path].filter(Boolean).join(' · ');
    a.append(t,m);li.appendChild(a);return li;
  }));
  document.getElementById('count').textContent=rows.length+' of '+data.dashboards.length+' pages';
}
q.oninput=render;render();
</script>
