                        <main className="flex-1 p-6 lg:p-8 overflow-hidden relative bg-term-bg">
                            {/* Render active module */}
                            {activeTab === 'live' && <ModuleLiveFeed />}
                            {activeTab === 'macro' && <ModuleMacroOutlook />}
                            {activeTab === 'whale' && <ModuleWhaleScanner />}
                            {activeTab === 'risk' && <ModuleSystemicRisk />}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons after render
        setTimeout(() => {
            lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
