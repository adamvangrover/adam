<!DOCTYPE html>
<html lang="en" data-adam-role="terminal" data-adam-family="publications">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADAM Publications — Review Panel</title>
<link rel="stylesheet" href="kit/adam-terminal.css">
<script src="js/review_panel.js" defer></script>
<!-- adam-kit -->
<link rel="stylesheet" href="kit/adam-kit.css">
<script src="kit/adam-kit.js"></script>
<!-- /adam-kit -->
</head>
<body class="adam-term">
<header class="adam-term__bar" data-adam-hook="terminal-header">
  <h1>Review Panel</h1>
  <nav data-adam-hook="terminal-nav">
    <a href="editions_browser.html">Editions</a><a href="price_target_explorer.html">Price targets</a><a href="review_panel.html" aria-current="page">Review</a><a href="catalog.html">Catalog</a>
  </nav>
  <span class="adam-term__muted" id="status" data-adam-hook="load-status" role="status">Loading showcase/data/publications…</span>
</header>
<p class="adam-term__label" role="note" data-adam-hook="estimated-label">Illustrative scenario — not investment advice. All figures are synthetic (<code>_estimated: true</code>, docs/PROVENANCE.md §2a). Machine view: <code>?view=json</code> or Alt+J.</p>
<main class="adam-term__main">
  <aside>
    <section class="adam-term__panel" data-adam-hook="filters">
      <h2>Filters</h2>
      <label for="f-family">Family</label><select id="f-family" data-adam-hook="filter-family"><option value="">All families</option></select>
      <label for="f-verdict">Desk verdict</label><select id="f-verdict" data-adam-hook="filter-verdict"><option value="">Any verdict</option></select>
      <label for="f-flag">Flag</label><select id="f-flag" data-adam-hook="filter-flag"><option value="">Any flag</option></select>
      <p class="adam-term__muted" id="summary" data-adam-hook="review-summary"></p>
    </section>
  </aside>
  <div>
    <section class="adam-term__panel" data-adam-hook="review-detail" id="detail" hidden></section>
    <section class="adam-term__panel" data-adam-hook="review-table">
      <h2>Reviewed editions</h2>
      <div class="adam-term__scroll"><table><thead><tr><th>Date</th><th>Family</th><th>Judge</th><th>Desk</th><th>Flags</th><th></th></tr></thead><tbody id="rows" data-adam-hook="review-rows"></tbody></table></div>
    </section>
  </div>
</main>
</body>
</html>
