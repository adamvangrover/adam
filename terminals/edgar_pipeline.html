        # SYSTEM ROLE: SEC EDGAR DATA PIPELINE ORCHESTRATOR
        # INVOCATION: Triggered via MCP Gateway (/mcp/tools/edgar-parse)

        ## PIPELINE INSTRUCTIONS:
        1. TARGET ACQUISITION:
           - Query SEC EDGAR REST API (https://data.sec.gov/submissions/CIK{cik}.json).
           - Target Sector: TMT (Telecom, Media, & Technology) / Leveraged Finance.
           - Default CIK: 0001018724 (Amazon) or dynamic input for recent S-1/10-Q filings.

        2. DATA EXTRACTION (XBRL Parsing):
           - Extract `Assets`, `Liabilities`, `OperatingIncomeLoss`, and `NetCashProvidedByOperatingActivities`.
           - Identify EBITDA add-backs and adjustments for covenant calculations.

        3. QUANTITATIVE RISK PROCESSING:
           - Calculate Total Leverage Ratio (Total Debt / Adjusted EBITDA).
           - Calculate Liquidity Coverage Ratio (LCR).
           - Run variables against Shared National Credit (SNC) stress-test models.

        4. JSON LOGIC GUARDRAILS:
           - Pass results through `/libraries/jsonLogic_rules.json`.
           - IF Leverage Ratio > 6.0 AND Sector == 'TMT': Flag as `SPECIAL_MENTION`.

        5. STATE MUTATION:
           - Update the `<script type="application/json" id="edgar-state">` block in this HTML file with the new data.
           - Ensure the DOM updates cleanly without breaking the structural HTML.
    </template>

                <p class="text-sm text-os-textMuted mb-4"><em>This snippet defines the deterministic extraction routines invoked by the LLM agent during evaluation.</em></p>

                <div class="bg-[#0d1117] p-4 rounded-lg overflow-x-auto border border-os-border custom-scrollbar relative">
                    <pre class="text-sm font-mono leading-relaxed"><code class="language-python">
<span class="text-[#ff7b72]">import</span> json
<span class="text-[#ff7b72]">import</span> httpx
<span class="text-[#ff7b72]">from</span> pydantic <span class="text-[#ff7b72]">import</span> BaseModel

<span class="text-[#ff7b72]">async def</span> <span class="text-[#d2a8ff]">trigger_edgar_pipeline</span>(cik: <span class="text-[#79c0ff]">str</span>):
    <span class="text-[#a5d6ff]">"""
    Agent executes this Python block to fetch SEC data, calculate leverage,
    evaluate against jsonLogic risk rules, and mutate the HTML state JSON.
    """</span>
    headers = {<span class="text-[#a5d6ff]">"User-Agent"</span>: <span class="text-[#a5d6ff]">"AdamOS-Risk-Agent/1.0"</span>}
    url = <span class="text-[#79c0ff]">f</span><span class="text-[#a5d6ff]">"https://data.sec.gov/submissions/CIK</span><span class="text-[#79c0ff]">{</span>cik.zfill(<span class="text-[#79c0ff]">10</span>)<span class="text-[#79c0ff]">}</span><span class="text-[#a5d6ff]">.json"</span>

    <span class="text-[#8b949e]"># 1. Fetch SEC Data</span>
    response = httpx.get(url, headers=headers)
    data = response.json()

    <span class="text-[#8b949e]"># 2. Extract & Compute Financials via XBRL Parsing Node</span>
    <span class="text-[#8b949e]"># total_debt = extract_xbrl_tag(data, 'LongTermDebt')</span>
    <span class="text-[#8b949e]"># adjusted_ebitda = calculate_ebitda_with_addbacks(data)</span>

    <span class="text-[#8b949e]"># 3. jsonLogic Evaluation (SNC Classification Engine)</span>
    <span class="text-[#8b949e]"># risk_flags = evaluate_covenants(total_debt / adjusted_ebitda, sector=data['sicDescription'])</span>

    <span class="text-[#8b949e]"># 4. State Mutation (Writes to DOM &lt;script id="edgar-state"&gt;)</span>
    <span class="text-[#8b949e]"># commit_to_adam_os_ui(cik, financials, risk_flags)</span>
                    </code></pre>
                </div>

        </div>

    <!-- =========================================================================
         DOM BINDING & INTERACTIVITY SCRIPT
         ========================================================================= -->
    <script>
        // Formatter utilities
        const formatCurrency = (num) => {
            if(num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
            if(num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
            return '$' + num.toLocaleString();
        };

        const formatDate = (dateString) => {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        };

        // Render UI from JSON State
        function renderUI() {
            const rawData = document.getElementById("edgar-state").textContent;
            let state;
            try {
                state = JSON.parse(rawData);
            } catch (e) {
                console.error("Failed to parse edgar-state JSON");
                return;
            }

            // Populate Metadata
            document.getElementById("ui-entity").textContent = state.metadata.entity_name;
            document.getElementById("ui-cik").textContent = state.metadata.cik;
            document.getElementById("ui-form").textContent = state.metadata.form_type;
            document.getElementById("ui-date").textContent = state.metadata.filing_date;

            // Status Bar Updates
            const statusEl = document.getElementById("ui-status");
            const statusDot = document.getElementById("ui-status-dot");
            statusEl.textContent = state.metadata.pipeline_status;

            // Reset status classes
            statusEl.className = "font-bold tracking-wide transition-colors ";
            statusDot.className = "w-2.5 h-2.5 rounded-full ";

            if (state.metadata.pipeline_status === "COMPLETED") {
                statusEl.classList.add("text-os-success", "glow-success");
                statusDot.classList.add("bg-os-success");
            } else if (state.metadata.pipeline_status === "FAILED") {
                statusEl.classList.add("text-os-danger", "glow-danger");
                statusDot.classList.add("bg-os-danger");
            } else {
                statusEl.classList.add("text-os-warning", "glow-warning");
                statusDot.classList.add("bg-os-warning", "animate-pulse");
            }

            document.getElementById("ui-last-run").innerHTML = `<i class="ph ph-clock mr-1"></i> LAST RUN: ${formatDate(state.metadata.last_run)}`;

            // Populate Financials
            document.getElementById("ui-leverage").textContent = state.financials.leverage_ratio.toFixed(2) + "x";
            document.getElementById("ui-lcr").textContent = state.financials.lcr + "%";
            document.getElementById("ui-covenant").textContent = state.risk_evaluation.covenant_headroom_bps;
            document.getElementById("ui-debt").textContent = formatCurrency(state.financials.total_debt);
            document.getElementById("ui-ebitda").textContent = formatCurrency(state.financials.adjusted_ebitda);

            // Populate Risk & Colors
            const sncClass = state.risk_evaluation.snc_classification;
            const sncEl = document.getElementById("ui-snc-class");
            const leverageCard = document.getElementById("leverage-card");

            sncEl.textContent = "CLASS: " + sncClass;

            // Clear previous risk classes
            sncEl.className = "text-sm font-bold mb-1 px-2 py-1 rounded border transition-colors ";
            leverageCard.className = "bg-os-terminalBg p-5 rounded-lg border-l-4 mb-6 relative overflow-hidden transition-colors duration-500 ";

            if(sncClass === "PASS" || sncClass === "SATISFACTORY") {
                sncEl.classList.add("text-os-success", "glow-success", "bg-os-success/10", "border-os-success/30");
                leverageCard.classList.add("border-os-success");
            } else if(sncClass === "SPECIAL_MENTION") {
                sncEl.classList.add("text-os-warning", "glow-warning", "bg-os-warning/10", "border-os-warning/30");
                leverageCard.classList.add("border-os-warning");
            } else if (sncClass === "SUBSTANDARD" || sncClass === "DOUBTFUL" || sncClass === "LOSS") {
                sncEl.classList.add("text-os-danger", "glow-danger", "bg-os-danger/10", "border-os-danger/30");
                leverageCard.classList.add("border-os-danger");
            }

            // Subordinate Risk color mapping
            const subRiskEl = document.getElementById("ui-sub-risk");
            subRiskEl.textContent = state.risk_evaluation.subordinate_tranche_risk;
            subRiskEl.className = "px-4 py-3 text-right font-bold transition-colors ";

            if(state.risk_evaluation.subordinate_tranche_risk === "ELEVATED") {
                subRiskEl.classList.add("text-os-warning");
            } else if(state.risk_evaluation.subordinate_tranche_risk === "SEVERE") {
                subRiskEl.classList.add("text-os-danger");
            } else {
                subRiskEl.classList.add("text-os-success");
            }

            // Populate Logs
            const logsContainer = document.getElementById("ui-logs");
            logsContainer.innerHTML = ""; // Clear existing
            state.jsonLogic_flags.forEach(flag => {
                const div = document.createElement("div");
                div.className = "pl-2 border-l-2 mb-1 opacity-0 animate-[fadeIn_0.3s_forwards]";
                div.textContent = "> " + flag;

                if(flag.startsWith("WARN")) {
                    div.classList.add("text-os-warning", "border-os-warning");
                } else if(flag.startsWith("ERR") || flag.startsWith("CRIT")) {
                    div.classList.add("text-os-danger", "border-os-danger");
                } else if(flag.startsWith("PASS")) {
                    div.classList.add("text-os-success", "border-os-success");
                } else {
                    div.classList.add("text-os-accent", "border-os-accent");
                }
                logsContainer.appendChild(div);
            });

            // Scroll logs to bottom
            const terminal = document.getElementById("terminal-container");
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Add tailwind keyframe programmatically for log fade in
        tailwind.config.theme.extend.keyframes.fadeIn = {
            '0%': { opacity: '0', transform: 'translateX(-10px)' },
            '100%': { opacity: '1', transform: 'translateX(0)' }
        };

        // Initialize UI on load
        document.addEventListener("DOMContentLoaded", renderUI);

        // Copy Code Functionality
        function copyCode() {
            const codeBlock = document.querySelector('code').innerText;
            navigator.clipboard.writeText(codeBlock).then(() => {
                const btn = document.querySelector('button[onclick="copyCode()"]');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="ph ph-check"></i> Copied!';
                btn.classList.add('bg-os-success/20', 'text-os-success');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.classList.remove('bg-os-success/20', 'text-os-success');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // =========================================================================
        // PIPELINE SIMULATION ENGINE (Demonstrates Agent Behavior)
        // =========================================================================

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function triggerPipeline() {
            const btn = document.getElementById('run-btn');
            const targetInput = document.getElementById('target-input');
            const cikVal = targetInput.value || "0001018724";

            // UI state: Running
            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Executing...';
            btn.classList.replace('bg-os-accent', 'bg-os-border');

            document.getElementById("ui-status").textContent = "PROCESSING...";
            document.getElementById("ui-status").className = "font-bold tracking-wide text-os-warning glow-warning";
            document.getElementById("ui-status-dot").className = "w-2.5 h-2.5 rounded-full bg-os-warning animate-spin";

            const logsContainer = document.getElementById("ui-logs");
            const cursor = document.getElementById("terminal-cursor");
            logsContainer.innerHTML = "";
            cursor.classList.remove("hidden");

            // Mock Log Sequence
            const logSequence = [
                { text: `INIT: Booting MCP SEC Tool. Target CIK [${cikVal}]`, delay: 300, type: 'info' },
                { text: `REQ: GET https://data.sec.gov/submissions/CIK${cikVal.padStart(10, '0')}.json`, delay: 800, type: 'info' },
                { text: `RES: 200 OK. Locating most recent 10-Q/10-K...`, delay: 600, type: 'info' },
                { text: `PARSE: XBRL taxonomy identified (us-gaap_2026). Extracting nodes...`, delay: 1000, type: 'info' },
                { text: `EXTRACT: LongTermDebt detected. Assessing off-balance sheet liabilities.`, delay: 700, type: 'info' },
                { text: `CALC: Computing Adjusted EBITDA based on sector specific add-backs...`, delay: 900, type: 'info' },
                { text: `EVAL: Running JSON Logic against SNC ruleset (v4.2.1)`, delay: 1200, type: 'info' }
            ];

            // Execute mock log streaming
            for (const log of logSequence) {
                await sleep(log.delay);
                const logEl = document.createElement("div");
                logEl.className = "pl-2 border-l-2 mb-1 text-os-textMuted border-os-border font-mono";
                logEl.textContent = "> " + log.text;
                logsContainer.appendChild(logEl);

                const terminal = document.getElementById("terminal-container");
                terminal.scrollTop = terminal.scrollHeight;
            }

            await sleep(1000); // Final processing delay

            // Generate dynamic "mock" result data based on random chance
            const debt = Math.floor(Math.random() * 8000000000) + 1000000000;
            const ebitda = Math.floor(Math.random() * 1500000000) + 100000000;
            const leverage = (debt / ebitda);

            let snc, subRisk, flags;
            if (leverage < 4.0) {
                snc = "PASS";
                subRisk = "LOW";
                flags = [
                    `PASS: Leverage (${leverage.toFixed(2)}x) well within SNC guidelines.`,
                    `INFO: Liquidity coverage robust. No immediate action required.`
                ];
            } else if (leverage < 6.0) {
                snc = "SPECIAL_MENTION";
                subRisk = "ELEVATED";
                flags = [
                    `WARN: Leverage (${leverage.toFixed(2)}x) approaching SNC critical threshold.`,
                    `INFO: Added to enhanced monitoring watchlist.`
                ];
            } else {
                snc = "SUBSTANDARD";
                subRisk = "SEVERE";
                flags = [
                    `CRIT: Leverage (${leverage.toFixed(2)}x) exceeds Basel III / SNC mandate!`,
                    `WARN: High probability of covenant breach within 12 months.`,
                    `ERR: Subordinate tranche modeled at < 20% recovery.`
                ];
            }

            // Define the new state object
            const newState = {
                metadata: {
                    cik: cikVal.padStart(10, '0'),
                    entity_name: "ACME DYNAMICS CORP (DYNAMIC DATA)",
                    form_type: Math.random() > 0.5 ? "10-Q" : "10-K",
                    filing_date: new Date(Date.now() - Math.random() * 10000000000).toISOString().split('T')[0],
                    pipeline_status: "COMPLETED",
                    last_run: new Date().toISOString()
                },
                financials: {
                    total_debt: debt,
                    adjusted_ebitda: ebitda,
                    leverage_ratio: leverage,
                    lcr: (Math.random() * 80 + 70).toFixed(1)
                },
                risk_evaluation: {
                    snc_classification: snc,
                    basel_iii_compliance: leverage < 6 ? "PASS" : "FAIL",
                    subordinate_tranche_risk: subRisk,
                    covenant_headroom_bps: Math.floor(Math.random() * 400) + (leverage > 6 ? -50 : 50)
                },
                jsonLogic_flags: flags
            };

            // Write to the DOM state tag (Mutating the Machine UI)
            document.getElementById("edgar-state").textContent = JSON.stringify(newState, null, 4);

            cursor.classList.add("hidden");

            // Trigger re-render of the Human UI
            renderUI();

            // Reset Button State
            btn.disabled = false;
            btn.innerHTML = '<i class="ph-bold ph-play"></i> Run Agent';
            btn.classList.replace('bg-os-border', 'bg-os-accent');
        }
    </script>
</body>
</html>
