<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADAM v30.1 :: Portable Vertical Slice — Institutional Financial OS</title>
<meta name="description" content="ADAM — Autonomous Deterministic Alpha Matrix. Standalone portable demo of the institutional-grade neuro-symbolic multi-agent financial operating system.">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════════
   ADAM v30.1 — UNIFIED DESIGN SYSTEM
   Single-file portable vertical slice
   ═══════════════════════════════════════════════════════════════ */

:root {
  --cyan: #00f3ff; --green: #0aff60; --red: #ff3333; --amber: #f59e0b;
  --purple: #a855f7; --blue: #3b82f6; --magenta: #ff007a; --gold: #fbbf24;
  --emerald: #10b981; --rose: #f43f5e; --violet: #8b5cf6; --orange: #f97316;
  --bg: #050b14; --bg-secondary: #0a1225; --bg-card: rgba(10, 18, 35, 0.75);
  --bg-glass: rgba(30, 41, 59, 0.45); --bg-hover: rgba(20, 28, 45, 0.85);
  --text: #e8ecf0; --text-secondary: #94a3b8; --text-muted: #64748b; --text-dim: #3e4a5c;
  --border: rgba(100, 116, 139, 0.2); --border-hover: rgba(100, 116, 139, 0.4);
  --radius: 10px; --radius-sm: 6px;
  --ease: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --gradient-brand: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
  --glow-cyan: 0 0 20px rgba(0, 243, 255, 0.15);
  --glow-blue: 0 0 20px rgba(59, 130, 246, 0.15);
  --shadow-lg: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

[data-theme="light"] {
  --bg: #f0f2f5; --bg-secondary: #e5e7eb; --bg-card: rgba(255,255,255,0.85);
  --bg-glass: rgba(255,255,255,0.7); --bg-hover: rgba(255,255,255,0.95);
  --text: #1a1a2e; --text-secondary: #4b5563; --text-muted: #6b7280; --text-dim: #9ca3af;
  --border: rgba(0,0,0,0.1); --border-hover: rgba(0,0,0,0.2);
  --cyan: #0891b2; --green: #059669; --red: #dc2626; --amber: #d97706; --purple: #7c3aed;
  --blue: #2563eb; --emerald: #059669; --rose: #e11d48; --violet: #6d28d9;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden; line-height: 1.55;
  display: flex; flex-direction: column;
}
.mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
a { color: inherit; text-decoration: none; transition: color var(--ease); }
a:hover { color: var(--cyan); }

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    linear-gradient(rgba(0,243,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,243,255,0.012) 1px, transparent 1px);
  background-size: 40px 40px;
}
[data-theme="light"] body::before { background: none; }

#particle-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
[data-theme="light"] #particle-canvas { opacity: 0.3; }

.scan-line {
  position: fixed; top: 0; left: 0; width: 100%; height: 2px;
  background: rgba(0, 243, 255, 0.06); box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
  animation: scan 8s linear infinite; pointer-events: none; z-index: 999;
}
[data-theme="light"] .scan-line { display: none; }
@keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px;
  background: rgba(5, 11, 20, 0.94); backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
}
[data-theme="light"] .topbar { background: rgba(255,255,255,0.92); }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--gradient-brand);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 14px; color: white;
  box-shadow: 0 0 15px rgba(59,130,246,0.3);
}
.topbar-brand { font-size: 1.15rem; font-weight: 800; color: var(--cyan); letter-spacing: 3px; font-family: 'JetBrains Mono', monospace; }
.topbar-badge { background: var(--cyan); color: #000; padding: 2px 7px; border-radius: 3px; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.5px; }
.topbar-sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.8px; border-left: 1px solid var(--border); padding-left: 10px; }
.topbar-right { display: flex; align-items: center; gap: 6px; }
.topbar-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 5px 10px; border: 1px solid var(--border); color: var(--text-muted); background: transparent; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--ease); letter-spacing: 0.5px; text-transform: uppercase; }
.topbar-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow-cyan); }
.theme-toggle { width: 30px; height: 30px; border: 1px solid var(--border); background: transparent; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; transition: all var(--ease); color: var(--text-muted); }
.theme-toggle:hover { border-color: var(--amber); color: var(--amber); }

.tab-bar { display: flex; gap: 0; overflow-x: auto; background: rgba(5, 11, 20, 0.8); border-bottom: 1px solid var(--border); position: sticky; top: 52px; z-index: 99; }
[data-theme="light"] .tab-bar { background: rgba(255,255,255,0.85); }
.tab-btn { padding: 10px 16px; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: all var(--ease); white-space: nowrap; user-select: none; display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; }
.tab-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.02); }
.tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.tab-icon { font-size: 1rem; }

.main-wrap { flex: 1; position: relative; z-index: 1; }
.tab-panel { display: none; padding: 20px 24px; animation: fadeIn 0.35s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.search-box { display: flex; align-items: center; gap: 8px; background: var(--bg-glass); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; margin-bottom: 18px; max-width: 500px; }
.search-box input { flex: 1; background: none; border: none; color: var(--text); font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; }
.search-box input::placeholder { color: var(--text-muted); }
.search-shortcut { font-size: 0.65rem; color: var(--text-dim); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; }

.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(12px); overflow: hidden; transition: all var(--ease); }
.card:hover { border-color: var(--border-hover); box-shadow: var(--glow-blue); transform: translateY(-2px); }
.card-header { padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(100,116,139,0.08); }
.card-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
.card-body { padding: 14px 16px; }

.metric-grid { display: grid; gap: 14px; }
.metric-grid-4 { grid-template-columns: repeat(4, 1fr); }
.metric-grid-5 { grid-template-columns: repeat(5, 1fr); }
.metric-grid-3 { grid-template-columns: repeat(3, 1fr); }
.metric-card { padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(12px); transition: all var(--ease); }
.metric-card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
.metric-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 4px; }
.metric-value { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.metric-delta { font-size: 0.72rem; font-weight: 600; margin-top: 3px; }
.delta-up { color: var(--emerald); }
.delta-down { color: var(--rose); }

.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.data-table th { text-align: left; padding: 8px 12px; font-weight: 700; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-secondary); }
.data-table td { padding: 6px 12px; border-bottom: 1px solid rgba(100,116,139,0.06); color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
.data-table tr:hover td { background: rgba(59,130,246,0.04); color: var(--text); }
.scrollable-table { max-height: 380px; overflow-y: auto; border-radius: var(--radius); }

.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.03em; }
.badge-ig { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.badge-hy { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.badge-dist { background: rgba(244,63,94,0.15); color: #fb7185; border: 1px solid rgba(244,63,94,0.3); }
.badge-live { background: rgba(16,185,129,0.15); color: var(--emerald); border: 1px solid rgba(16,185,129,0.3); animation: pulse-badge 2s infinite; }
.badge-info { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
.badge-warn { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.badge-pass { background: rgba(16,185,129,0.15); color: var(--emerald); }
.badge-fail { background: rgba(244,63,94,0.15); color: var(--rose); }
@keyframes pulse-badge { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.module-card { display: block; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all var(--ease); }
.module-card:hover { border-color: var(--border-hover); box-shadow: var(--glow-blue); transform: translateY(-2px); }
.module-card h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; }
.module-card p { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.5; }
.module-card .tag { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

.btn { padding: 8px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-glass); color: var(--text); font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all var(--ease); display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; }
.btn:hover { background: rgba(59,130,246,0.15); border-color: var(--blue); }
.btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0,243,255,0.08); }
.btn-primary { background: var(--gradient-brand); border: none; color: white; }
.btn-primary:hover { box-shadow: 0 0 20px rgba(59,130,246,0.4); transform: translateY(-1px); }
.btn-danger { border-color: var(--rose); color: var(--rose); }
.btn-danger:hover { background: rgba(244,63,94,0.15); }

.input, select.input { padding: 7px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; outline: none; transition: border var(--ease); }
.input:focus { border-color: var(--cyan); }
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 6px 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--cyan); cursor: pointer; margin-top: -4px; box-shadow: 0 0 8px rgba(0,243,255,0.4); }
input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: var(--border); border-radius: 2px; }

.section-header { font-weight: 800; letter-spacing: -0.02em; margin: 24px 0 14px; display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-size: 0.85rem; color: var(--text-secondary); }
.section-header .icon { font-size: 1.1rem; }
.section-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; }

.terminal-log { background: #000; border: 1px solid rgba(100,116,139,0.15); border-radius: var(--radius); padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; line-height: 1.65; color: var(--text-secondary); max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.t-cyan { color: var(--cyan); } .t-green { color: var(--emerald); } .t-red { color: var(--rose); } .t-amber { color: var(--amber); } .t-purple { color: var(--violet); } .t-dim { color: var(--text-dim); } .t-bold { color: var(--text); font-weight: 700; }

.status-bar { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--text-muted); border-top: 1px solid var(--border); background: rgba(5,11,20,0.9); position: sticky; bottom: 0; z-index: 99; }
[data-theme="light"] .status-bar { background: rgba(255,255,255,0.9); }
.status-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.status-green { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }

.ticker-bar { height: 26px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; position: relative; z-index: 98; }
.ticker-content { display: flex; gap: 32px; white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--text-secondary); animation: ticker 60s linear infinite; }
@keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-200%); } }

.toast-container { position: fixed; bottom: 60px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 6px; }
.toast { padding: 8px 14px; background: rgba(5,11,20,0.95); border: 1px solid var(--cyan); border-radius: var(--radius-sm); color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; backdrop-filter: blur(10px); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

.chart-wrap { position: relative; width: 100%; height: 260px; }
.chart-wrap canvas { width: 100% !important; height: 100% !important; }

@media (max-width: 1200px) { .grid-4, .metric-grid-4, .metric-grid-5 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .grid-2, .grid-3, .grid-4, .metric-grid-3, .metric-grid-4, .metric-grid-5 { grid-template-columns: 1fr; } .topbar-sub { display: none; } .tab-btn { padding: 8px 10px; font-size: 0.7rem; } }
@media (max-width: 500px) { .topbar-right .topbar-btn { display: none; } }
</style>
</head>

<script>
(function() {
'use strict';

const SECTORS = ['Technology','Healthcare','Financials','Energy','Industrials','Consumer','Telecom','Materials','Utilities','Real Estate'];
const RATINGS = ['AAA','AA+','AA','AA-','A+','A','A-','BBB+','BBB','BBB-','BB+','BB','BB-','B+','B','B-','CCC+','CCC','CCC-'];
const AGENT_POLICIES = ['Liquidity Hoarder','Buyback Cut','Emergency Line Draw','Capex Reduction','Hedging Active'];
const AGENT_STATES = ['OPTIMAL','STRESSED','CONSTRAINED','DISTRESSED'];

function seededRandom(seed) { let s=seed; return function(){ s=(s*16807)%2147483647; return(s-1)/2147483646; }; }
const rng = seededRandom(20260912);

const ENTITIES = Array.from({length: 500}, (_, i) => {
  const r = rng;
  const sector = SECTORS[Math.floor(r() * SECTORS.length)];
  const ratingIdx = Math.floor(r() * RATINGS.length);
  const rating = RATINGS[ratingIdx];
  const isIG = ratingIdx <= 9;
  const pd = isIG ? +(r() * 2).toFixed(3) : +(2 + r() * 20).toFixed(3);
  return {
    id: 'ENT-'+String(i+1).padStart(4,'0'),
    name: ['Apex','Nova','Quantum','Titan','Vertex','Omega','Nexus','Cipher','Prism','Helix'][i%10]+' '+sector.slice(0,4)+' '+['Corp','Inc','Ltd','Holdings','Group'][i%5],
    sector, rating, isIG, pd, lgd: +(20 + r() * 50).toFixed(1),
    ev: +(500 + r() * 9500).toFixed(0), leverage: +(1 + r() * 8).toFixed(1),
    ebitdaMargin: +(5 + r() * 35).toFixed(1), fccr: +(0.5 + r() * 4).toFixed(2),
    alphaPD: +(pd * (0.7 + r() * 0.6)).toFixed(3), betaPD: +(pd * (0.8 + r() * 0.8)).toFixed(3),
    agentPolicy: AGENT_POLICIES[Math.floor(r() * AGENT_POLICIES.length)],
    agentState: AGENT_STATES[Math.floor(r() * AGENT_STATES.length)]
  };

window.caCalc = function() {
  var rev=+document.getElementById('ca-rev').value,ebitda=+document.getElementById('ca-ebitda').value,debt=+document.getElementById('ca-debt').value,cash=+document.getElementById('ca-cash').value,capex=+document.getElementById('ca-capex').value,rate=+document.getElementById('ca-rate').value/100,g=+document.getElementById('ca-growth').value/100,wacc=+document.getElementById('ca-wacc').value/100;
  var fcf=ebitda-capex-debt*rate*0.65;var netDebt=debt-cash;var leverage=(ebitda>0?netDebt/ebitda:0).toFixed(1);var icr=(rate>0?ebitda/(debt*rate):0).toFixed(2);var fccr=(ebitda>0?fcf/((debt*rate)+capex*0.1):0).toFixed(2);var margin=(rev>0?ebitda/rev*100:0).toFixed(1);
  var ev=0,cfs=[];for(var y=1;y<=5;y++){var cf=fcf*Math.pow(1+g,y);ev+=cf/Math.pow(1+wacc,y);cfs.push(Math.round(cf));}var tv=cfs[4]*1.025/(wacc-0.025);ev+=tv/Math.pow(1+wacc,5);var equity=ev-netDebt;
  var pd=Math.min(99,Math.max(0.01,0.3*Math.pow(parseFloat(leverage),1.8)/Math.pow(parseFloat(icr),1.2)));var ratingMap=[[0.1,'AAA'],[0.3,'AA'],[0.5,'A+'],[1,'A'],[2,'BBB+'],[3,'BBB'],[5,'BB+'],[7,'BB'],[10,'B+'],[15,'B'],[25,'CCC'],[100,'D']];var rating='D';for(var k=0;k<ratingMap.length;k++){if(pd<=ratingMap[k][0]){rating=ratingMap[k][1];break;}}
  document.getElementById('ca-ev').textContent='$'+Math.round(ev).toLocaleString()+'M';document.getElementById('ca-equity').textContent='$'+Math.round(equity).toLocaleString()+'M';document.getElementById('ca-lev').textContent=leverage+'x';document.getElementById('ca-rating').textContent=rating;
  var metrics=[['EBITDA Margin',margin+'%',parseFloat(margin)>20?'STRONG':'WEAK'],['Net Leverage',leverage+'x',parseFloat(leverage)<4?'STRONG':parseFloat(leverage)<6?'ADEQUATE':'STRESSED'],['Interest Coverage',icr+'x',parseFloat(icr)>2.5?'STRONG':parseFloat(icr)>1.5?'ADEQUATE':'DISTRESSED'],['Fixed Charge Coverage',fccr+'x',parseFloat(fccr)>1.5?'STRONG':parseFloat(fccr)>1?'ADEQUATE':'WEAK'],['Unlevered FCF','$'+Math.round(fcf)+'M',fcf>0?'POSITIVE':'NEGATIVE'],['Implied PD (1Y)',pd.toFixed(2)+'%',pd<3?'LOW':pd<8?'MODERATE':'HIGH']];
  document.getElementById('ca-metrics').innerHTML=metrics.map(function(m){var c=m[2]==='STRONG'||m[2]==='POSITIVE'||m[2]==='LOW'?'badge-pass':m[2]==='ADEQUATE'||m[2]==='MODERATE'?'badge-warn':'badge-fail';return'<tr><td>'+m[0]+'</td><td class="mono">'+m[1]+'</td><td><span class="badge '+c+'">'+m[2]+'</span></td></tr>';}).join('');
  if(typeof Chart!=='undefined'){if(chartInstances.ca)chartInstances.ca.destroy();chartInstances.ca=new Chart(document.getElementById('ca-chart'),{type:'bar',data:{labels:['Y1','Y2','Y3','Y4','Y5','Terminal'],datasets:[{label:'FCF ($M)',data:cfs.concat([Math.round(tv/Math.pow(1+wacc,5))]),backgroundColor:['#06b6d4','#06b6d4','#06b6d4','#06b6d4','#06b6d4','#8b5cf6'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:'#64748b'},grid:{display:false}},y:{ticks:{color:'#64748b',callback:function(v){return'$'+v+'M';}},grid:{color:'rgba(100,116,139,0.1)'}}},plugins:{legend:{display:false}}}});}
};

// Particle Canvas
var canvas=document.getElementById('particle-canvas'),ctx=canvas.getContext('2d'),particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
function initParticles(){particles=[];var count=Math.min(Math.floor((canvas.width*canvas.height)/22000),60);for(var i=0;i<count;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*0.35,vy:(Math.random()-0.5)*0.35,r:Math.random()*1.2+0.4});}}
function drawParticles(){ctx.clearRect(0,0,canvas.width,canvas.height);var isLight=document.documentElement.getAttribute('data-theme')==='light';var pColor=isLight?'rgba(8,145,178,':'rgba(0,243,255,';for(var i=0;i<particles.length;i++){var p=particles[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=pColor+'0.4)';ctx.fill();for(var j=i+1;j<particles.length;j++){var q=particles[j];var dx=p.x-q.x,dy=p.y-q.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<110){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=pColor+(0.1*(1-dist/110)).toFixed(3)+')';ctx.lineWidth=0.4;ctx.stroke();}}}requestAnimationFrame(drawParticles);}
resizeCanvas();initParticles();drawParticles();window.addEventListener('resize',function(){resizeCanvas();initParticles();});
