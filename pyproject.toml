[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "adam-kernel"
version = "30.1.0"
description = "Autonomous Deterministic Alpha Matrix - Unified Kernel"
authors = [{ name = "Adam Van Grover" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.11.10",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.2",
    "uuid_utils>=0.12.0",
    "colorlog>=6.10.1",
    "python-json-logger>=4.0.0",
    "json-logic-qubit",
    "temporalio",
]

[project.optional-dependencies]
async-web = [
    "fastapi>=0.128.0",
    "uvicorn>=0.34.0",
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.2",
    "Flask-SocketIO>=5.6.0",
    "Flask-JWT-Extended>=4.7.1",
    "aiohttp>=3.13.4",
    "anyio>=4.12.0",
    "websockets>=15.0.1",
]
data-science = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "sympy",
    "statsmodels>=0.14.6",
    "optuna>=4.6.0",
]
ml-tensors = [
    "torch>=2.9.0",
    "transformers>=5.0.0rc3",
    "sentence-transformers>=3.4.1",
    "triton",
    "peft",
]
orchestration = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "litellm>=1.0.0",
    "langchain>=1.2.0",
    "langchain-core>=1.3.3",
    "langgraph>=1.0.10",
    "dspy-ai>=3.0.4",
    "mesa>=3.0.0",
    "pydantic-ai>=1.56.0",
]
finance = [
    "yfinance>=1.1.0",
    "ta>=0.11.0",
    "PyPortfolioOpt>=1.5.5",
    "edgartools>=5.8.1",
    "numpy-financial>=1.0.0",
    "pandas",
]
quantum = [
    "qiskit>=1.2.0",
    "qiskit-finance>=0.4.0",
    "qiskit-aer>=0.14.0",
    "numpy",
]
infrastructure = [
    "SQLAlchemy>=2.0.45",
    "neo4j>=6.0.3",
    "redis>=7.1.0",
    "celery>=5.6.2",
    "kombu>=5.6.2",
]
observability = [
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "mcp>=1.0.0",
    "fastmcp>=3.2.0",
]
full-kernel = [
    "fastapi",
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "litellm",
    "langchain",
    "yfinance",
    "SQLAlchemy",
    "redis",
    "celery",
]
risk-agent = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "yfinance",
    "SQLAlchemy",
    "redis",
    "openai",
]

[tool.maturin]
python-source = "."
features = ["pyo3/extension-module"]
manifest-path = "rust_ext/Cargo.toml"
python-packages = ["core", "services", "adam_v3"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "celery>=5.6.3",
    "hypothesis>=6.168.0",
    "json-logic-qubit>=0.9.1",
    "jsonschema>=4.26.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest-asyncio>=1.4.0",
    "pytest>=9.0.3",
    "ruff>=0.14.10",
    "black>=26.3.1",
    "mypy>=1.19.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN", "C90", "N", "UP", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["adam", "nexus", "sentinel", "odyssey", "bolt"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = [".", "core"]
