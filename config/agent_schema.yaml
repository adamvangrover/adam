version: "30.1.0"
governance_policy:
  thresholds:
    autonomous_execution:
      min_confidence: 0.85
      review_required: false
      description: "Autonomous execution permitted for low/medium-impact actions."
    human_in_the_loop:
      min_confidence: 0.50
      max_confidence: 0.8499
      review_required: true
      description: "Execution paused. Mandatory HITL approval required."
    rejection:
      max_confidence: 0.4999
      review_required: false
      description: "Hard execution abort. System halts and records failure event."

roles:
  underwriting_agent:
    id: "AFOS-UWR-01"
    authority: "Obligor Credit Evaluation"
    constraints:
      - "MUST compute dual obligor-level PD (Model Alpha and Model Beta) to support neutrality arbitration."
      - "MUST NOT calculate bespoke facility-level PD; facility PD is derived strictly from structural rating maps and LGD adjustments."
    allowed_tools:
      - "financial_statement_parser"
      - "model_alpha_client"
      - "model_beta_client"
      - "arbitration_calculator"

  compliance_agent:
    id: "AFOS-CMP-01"
    authority: "Regulatory Capital & Audit Verification"
    constraints:
      - "MUST evaluate bidirectional divergence against threshold theta."
      - "MUST verify downside risk spread prior to capital buffer allocation."
    allowed_tools:
      - "divergence_validator"
      - "audit_logger"

# Lifecycle hooks in core/engine/harness/ (h_ctx, h_ctrl, h_act, h_ver) read these values; none are
# hardcoded in Python. Budget and recursion limits follow CONSTITUTION.md §6.
harness:
  context:            # h_ctx — pre-turn
    observations_key: "observations"
    keep_last_observations: 3
    masked_placeholder: "[masked: stale observation]"
    max_context_tokens: 150000
    chars_per_token: 4
  control:            # h_ctrl — pre-turn
    max_turns: 8
    max_duplicate_tool_calls: 2
  action:             # h_act — post-tool
    max_stdout_chars: 4000
    truncation_marker: "\n...[truncated {omitted} chars]"
  verification:       # h_ver — pre-stop
    abort_confidence: 0.0
    hitl_impact_levels: ["high", "critical"]
    high_impact_actions:
      - "commit_capital"
      - "sign_advisory_notice"
      - "modify_ledger_balance"
      - "submit_regulatory_report"
      - "execute_trade"
