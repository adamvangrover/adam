# Crisis-simulation metadata for portfolio symbols, consumed by
# MetaOrchestrator._positions_from_allocation (core/engine/meta_orchestrator.py).
# Fields: sector (SectorImpactEngine sector names), leverage (x EBITDA proxy), rating.
# Convention (docs/PROVENANCE.md): every entry has either `source` (where the values come from)
# or `_estimated: true` (hand-picked proxy values, not sourced data).
# Symbols missing here are skipped with a warning, never defaulted.

SPY:
